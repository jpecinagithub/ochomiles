  transition:transform .28s ease}
.eyebrow{font-family:var(--f-display);font-weight:600;letter-spacing:.22em;font-size:11px;color:var(--accent);
  text-transform:uppercase;padding:18px 20px 0}

<script>
"use strict";
/* ============================================================
   OCHOMILES — mapa en relieve de las 14 cimas de +8000 m
   Código original. Datos: window.OCHO (datos-base.js) y
   window.OCHO_PATCH (datos-picos.js, opcional).
   ============================================================ */

/*DECODERS-START*/
/* Decodificadores del formato binario descrito en SCHEMA.md:
   base64 -> LEB128 sin signo -> zigzag -> deltas acumulados. */
function b64ToBytes(s){
  var bin = atob(s), n = bin.length, out = new Uint8Array(n);
  for(var i=0;i<n;i++) out[i]=bin.charCodeAt(i);
  return out;
}
function decInts(s){
  var b=b64ToBytes(s), vals=[], i=0, n=b.length;
  while(i<n){
    var shift=0, res=0, byte;
    do{ byte=b[i++]; res|=(byte&0x7F)<<shift; shift+=7; }while(byte&0x80);
    var z=res>>>0, d=(z>>>1)^(-(z&1));
    vals.push(vals.length? vals[vals.length-1]+d : d);
  }
  return vals;
}
function decU8(s){ return b64ToBytes(s); }
/* Polilíneas: varint(npts), luego dx,dy acumulados (absolutos entre
   líneas), en microgrados. Devuelve [[[lon,lat],...],...]. */
function decLines(s){
  var ints=decInts(s), lines=[], k=0, x=0, y=0;
  while(k<ints.length){
    var npts=ints[k++], line=[];
    for(var p=0;p<npts;p++){ x+=ints[k]; y+=ints[k+1]; k+=2; line.push([x/1e6,y/1e6]); }
    lines.push(line);
  }
  return lines;
}
/*DECODERS-END*/

/* ---------------- state ---------------- */
var OD=null;
var grid=null, dem=null, lc=null;
var contours=[], rivers=[], lakes=[], borders=[];
var peaks=[], zones=[], towns=[], basecamps=[], photos=[];
var view={clon:0,clat:0,scale:100};
var layers={contours:true,water:true,towns:true,borders:true,labels:true};
var query="";
var SUN_AZ=315; /* acimut del sol, fijo */
var openPeakId=null, reliefCache=null, patchCache={}, renderQueued=false;
var $=function(id){return document.getElementById(id);};

function hasPatch(){return (typeof window.OCHO_PATCH!=="undefined")&&window.OCHO_PATCH;}
function getPatch(id){var p=hasPatch()?window.OCHO_PATCH:null;return p?p[id]||null:null;}
function hasRoutes(){return (typeof window.OCHO_ROUTES!=="undefined")&&window.OCHO_ROUTES;}
function getRoute(id){var r=hasRoutes()?window.OCHO_ROUTES:null;return r?r[id]||null:null;}
var routeCache={};
function peakRouteList(id){
  /* Lista de {r, lines} para picos con varias vías (rt.routes);
     null si el pico usa la vía única clásica. */
  var ck="multi:"+id;
  if(routeCache[ck]!==undefined)return routeCache[ck];
  var rt=getRoute(id),out=null;
  if(rt&&rt.routes&&rt.routes.length){
    out=rt.routes.map(function(r){return {r:r,lines:decLines(r.line)};});
  }
  routeCache[ck]=out;return out;
}
function routeLines(id){
  if(routeCache[id])return routeCache[id];
  var rt=getRoute(id),lines=null;
  if(rt&&rt.line){try{lines=decLines(rt.line);}catch(e){lines=null;}}
  routeCache[id]=lines;
  return lines;
}

/* ---------------- data load ---------------- */
function loadData(){
  if(typeof window.OCHO==="undefined"||!window.OCHO){$("fatal").style.display="flex";$("loader").classList.add("done");return false;}
  OD=window.OCHO; grid=OD.grid;
  dem=decInts(OD.dem); lc=decU8(OD.lc);
  contours=(OD.contours||[]).map(function(c){return{e:c.e,lines:decLines(c.d)};});
  rivers=(OD.rivers||[]).map(function(r){return{n:r.n,lines:decLines(r.d)};});
  lakes=(OD.lakes||[]).map(function(l){return{n:l.n,lines:decLines(l.d)};});
  borders=(OD.borders||[]).map(function(b){return{lines:decLines(b.d)};});
  peaks=(OD.peaks||[]).slice().sort(function(a,b){return b.a-a.a;});
  zones=OD.zones||[]; towns=OD.towns||[]; photos=OD.photos||[];
  var seen={};
  peaks.forEach(function(p){if(p.bc&&p.bc.lat!=null){var k=p.bc.lat.toFixed(4)+","+p.bc.lon.toFixed(4);
    if(!seen[k]){seen[k]=1;basecamps.push({n:p.bc.n,lat:p.bc.lat,lon:p.bc.lon});}}});
  return true;
}
function countryCount(){
  var s={};
  peaks.forEach(function(p){String(p.ctr).split("/").forEach(function(c){
    c=c.trim().replace(/\s*\(.*?\)\s*/g,"");if(c)s[c]=1;});});
  return Object.keys(s).length;
}
function fmtM(m){return Math.round(m).toLocaleString("es-ES")+" "+"m";}
function fmtAlt(a){return Number(a).toLocaleString("es-ES",{maximumFractionDigits:2})+" "+"m";}
function havKm(a,b,c,d){var R=6371,r=Math.PI/180,
  s1=Math.sin((c-a)*r/2),s2=Math.sin((d-b)*r/2),
  h=s1*s1+Math.cos(a*r)*Math.cos(c*r)*s2*s2;return 2*R*Math.asin(Math.sqrt(h));}

/* ---------------- projection (equirectangular with latitude correction) ---------------- */
var cv=$("map"), ctx=cv.getContext("2d"), W=0, H=0, DPR=1;
function cosC(){return Math.cos(view.clat*Math.PI/180);}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=cv.clientWidth; H=cv.clientHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  requestRender();
}
function proj(lon,lat){return [(lon-view.clon)*cosC()*view.scale+W/2,(view.clat-lat)*view.scale+H/2];}
function unproj(x,y){return [view.clon+(x-W/2)/view.scale/cosC(), view.clat-(y-H/2)/view.scale];}
function fitAll(){
  if(!peaks.length)return;
  var lo=1e9,la=1e9,hi=-1e9,ha=-1e9;
  peaks.forEach(function(p){lo=Math.min(lo,p.lon);hi=Math.max(hi,p.lon);la=Math.min(la,p.lat);ha=Math.max(ha,p.lat);});
  var pw=Math.max(hi-lo,0.5),ph=Math.max(ha-la,0.5),pad=1.18;
  view.clon=(lo+hi)/2; view.clat=(la+ha)/2;
  var kx=Math.cos(((la+ha)/2)*Math.PI/180);
  view.scale=Math.min(W/(pw*kx*pad),H/(ph*pad));
  clampView(); requestRender();
}
function clampView(){
  view.scale=Math.max(8,Math.min(view.scale,60000));
  view.clon=Math.max(grid.lon0-8,Math.min(grid.lon1+8,view.clon));
  view.clat=Math.max(grid.lat0-8,Math.min(grid.lat1+8,view.clat));
}
function zoomAt(x,y,f){
  var ll=unproj(x,y), ns=view.scale*f;
  ns=Math.max(8,Math.min(ns,60000));
  var k=ns/view.scale; view.scale=ns;
  view.clon=ll[0]-(x-W/2)/ns; view.clat=ll[1]+(y-H/2)/ns;
  clampView(); requestRender();
}

/* ---------------- relief rasterizer ----------------
   Hillshade NW (azimuth ajustable) + rampa hipsométrica + matiz por cobertura. */
var RAMP=[[0,[106,143,78]],[1500,[154,162,92]],[3000,[185,154,99]],[4500,[169,138,109]],
          [6000,[141,141,144]],[7500,[207,212,214]],[9000,[255,255,255]]];
var LC_TINT={1:[235,242,248],2:[150,146,140],3:[122,148,88],4:[52,92,58],5:[140,170,105]};
function rampColor(z){
  var a=RAMP[0],b=RAMP[RAMP.length-1],i;
  for(i=0;i<RAMP.length-1;i++){if(z<=RAMP[i+1][0]){a=RAMP[i];b=RAMP[i+1];break;}}
  var f=b[0]===a[0]?0:Math.max(0,Math.min(1,(z-a[0])/(b[0]-a[0])));
  return [a[1][0]+(b[1][0]-a[1][0])*f, a[1][1]+(b[1][1]-a[1][1])*f, a[1][2]+(b[1][2]-a[1][2])*f];
}
function rasterize(dm,lcArr,g,azDeg){
  var w=g.w,h=g.h,cnv=document.createElement("canvas");cnv.width=w;cnv.height=h;
  var cx=cnv.getContext("2d"),img=cx.createImageData(w,h),px=img.data;
  var az=azDeg*Math.PI/180,zen=45*Math.PI/180;
  var cosZ=Math.cos(zen),sinZ=Math.sin(zen);
  var dLon=(g.lon1-g.lon0)/w,dLat=(g.lat1-g.lat0)/h;
  for(var j=0;j<h;j++){
    var lat=g.lat1-(j+0.5)*dLat;
    var mx=dLon*111320*Math.cos(lat*Math.PI/180),my=dLat*110540;
    var jm=Math.max(j-1,0)*w,jp=Math.min(j+1,h-1)*w,jc=j*w;
    for(var i=0;i<w;i++){
      var idx=jc+i,z=dm[idx];
      var gx=(dm[jc+Math.min(i+1,w-1)]-dm[jc+Math.max(i-1,0)])/(2*mx);
      var gy=(dm[jp+i]-dm[jm+i])/(2*my);
      var slope=Math.atan(Math.hypot(gx,gy));
      var aspect=Math.atan2(-gx,gy);
      var hs=cosZ*Math.cos(slope)+sinZ*Math.sin(slope)*Math.cos(az-aspect);
      hs=Math.max(0,Math.min(1,hs));
      var c=rampColor(z),cls=lcArr?lcArr[idx]:0,tn=LC_TINT[cls];
      var r=c[0],gg=c[1],b=c[2];
      if(tn){r=r*0.62+tn[0]*0.38;gg=gg*0.62+tn[1]*0.38;b=b*0.62+tn[2]*0.38;}
      var sh=0.42+0.58*hs,o=idx*4;
      px[o]=r*sh*0.52;px[o+1]=gg*sh*0.55;
      px[o+2]=b*sh*0.6;px[o+3]=255;
    }
  }
  cx.putImageData(img,0,0);
  return cnv;
}
function reliefBase(){
  if(reliefCache)return reliefCache.cnv;
  reliefCache={cnv:rasterize(dem,lc,grid,SUN_AZ)};
  return reliefCache.cnv;
}
function reliefPatch(id){
  var pc=getPatch(id);if(!pc)return null;
  if(patchCache[id])return patchCache[id];
  var d=decInts(pc.dem);
  var cnv=rasterize(d,null,pc,SUN_AZ);
  patchCache={};patchCache[id]=cnv; /* one cached patch is enough */
  return cnv;
}

/* ---------------- render ---------------- */
function requestRender(){if(!renderQueued){renderQueued=true;requestAnimationFrame(draw);}}
function css(v){var s=getComputedStyle(document.documentElement);return s.getPropertyValue(v).trim();}
function draw(){
  renderQueued=false;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  if(!OD)return;
  /* base relief */
  var base=reliefBase();
  var p0=proj(grid.lon0,grid.lat1),p1=proj(grid.lon1,grid.lat0);
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
  ctx.drawImage(base,p0[0],p0[1],p1[0]-p0[0],p1[1]-p0[1]);
  /* high-res patches at deep zoom */
  if(hasPatch()){
    for(var id in window.OCHO_PATCH){
      var pc=window.OCHO_PATCH[id];
      var hw=(W/2)/view.scale/cosC(),hh=(H/2)/view.scale;
      if(view.clon+hw<pc.lon0||view.clon-hw>pc.lon1||
         view.clat+hh<pc.lat0||view.clat-hh>pc.lat1)continue;
      var native=pc.w/(pc.lon1-pc.lon0);
      if(view.scale<native*0.7)continue;
      var cnv=reliefPatch(id);if(!cnv)continue;
      var q0=proj(pc.lon0,pc.lat1),q1=proj(pc.lon1,pc.lat0);
      ctx.drawImage(cnv,q0[0],q0[1],q1[0]-q0[0],q1[1]-q0[1]);
    }
  }
  var ink=css("--ink");
  /* borders */
  if(layers.borders){
    ctx.strokeStyle="rgba(233,238,241,.5)";ctx.lineWidth=1.3;
    ctx.setLineDash([7,5]);drawLines(borders);ctx.setLineDash([]);
  }
  /* contours */
  if(layers.contours){
    contours.forEach(function(c){
      var major=(c.e%2000===0);
      ctx.strokeStyle=(major?"rgba(233,238,241,.34)":"rgba(233,238,241,.2)");
      ctx.lineWidth=major?1.2:0.7;drawLines([c]);
    });
  }
  /* water */
  if(layers.water){
    var wc=css("--water");
    ctx.strokeStyle=wc;ctx.lineWidth=1.6;ctx.lineCap="round";
    rivers.forEach(function(r){drawLines([r]);});
    lakes.forEach(function(l){fillLines(l,wc);});
  }
  /* towns + base camps */
  if(layers.towns){
    ctx.font="600 11px Barlow,sans-serif";ctx.textAlign="left";
    towns.forEach(function(tw){
      var s=proj(tw.lon,tw.lat);if(s[0]<-40||s[0]>W+40||s[1]<-20||s[1]>H+20)return;
      ctx.fillStyle=ink;ctx.beginPath();ctx.arc(s[0],s[1],tw.k===2?4:3,0,7);ctx.fill();
      halo(tw.n,s[0]+7,s[1]+4);
    });
    var wcol=css("--water");
    basecamps.forEach(function(bc){
      var s=proj(bc.lon,bc.lat);if(s[0]<-60||s[0]>W+60||s[1]<-30||s[1]>H+30)return;
      ctx.strokeStyle=wcol;ctx.fillStyle="#10161b";ctx.lineWidth=1.6;
      ctx.beginPath();ctx.moveTo(s[0]-7,s[1]+5);ctx.lineTo(s[0],s[1]-7);ctx.lineTo(s[0]+7,s[1]+5);
      ctx.closePath();ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.moveTo(s[0],s[1]-7);ctx.lineTo(s[0],s[1]+5);ctx.stroke();
      halo(bc.n,s[0]+10,s[1]+4);
    });
  }
  /* peaks */
  var acc=css("--accent");
  ctx.textAlign="center";
  peaks.forEach(function(p){
    var s=proj(p.lon,p.lat);if(s[0]<-50||s[0]>W+50||s[1]<-40||s[1]>H+40)return;
    var sel=(p.id===openPeakId);
    ctx.fillStyle=acc;
    var r0=sel?8.5:6.5;
    ctx.beginPath();ctx.moveTo(s[0],s[1]-r0);ctx.lineTo(s[0]+r0*0.95,s[1]+r0*0.75);ctx.lineTo(s[0]-r0*0.95,s[1]+r0*0.75);
    ctx.closePath();ctx.fill();
    if(sel){ctx.strokeStyle="#fff";ctx.lineWidth=1.6;ctx.stroke();}
    if(layers.labels){
      ctx.font=(sel?"700 13px":"600 12px")+" Barlow,sans-serif";
      haloC(p.n,s[0],s[1]-r0-7);
    }
  });
  /* selected peak: routes + camps */
  var rt=openPeakId?getRoute(openPeakId):null;
  if(rt){
    var multi=peakRouteList(openPeakId);
    /* anti-solape de etiquetas: se dibujan por prioridad (campamentos >
       vías > hitos) y se omite la que caiga a menos de ~60 px de otra. */
    var placed=[];
    function free(x,y){
      for(var i=0;i<placed.length;i++){var p=placed[i],dx=p[0]-x,dy=p[1]-y;
        if(dx*dx+dy*dy<3600)return false;}
      placed.push([x,y]);return true;
    }
    function drawRouteLines(lines,color,width,dash){
      if(!lines||!lines.length)return;
      ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap="round";ctx.setLineDash(dash);
      ctx.beginPath();
      lines.forEach(function(line){
        var started=false;
        for(var i=0;i<line.length;i++){
          var s=proj(line[i][0],line[i][1]);
          if(s[0]<-80||s[0]>W+80||s[1]<-80||s[1]>H+80){started=false;continue;}
          if(!started){ctx.moveTo(s[0],s[1]);started=true;}else ctx.lineTo(s[0],s[1]);
        }
      });
      ctx.stroke();ctx.setLineDash([]);
    }
    if(multi){
      multi.forEach(function(it,ix){
        var normal=ix===0;
        drawRouteLines(it.lines,it.r.color||acc,normal?2.6:2.2,normal?[8,5]:[]);
      });
    }else{
      drawRouteLines(routeLines(openPeakId),acc,2.6,[8,5]);
    }
    (rt.camps||[]).forEach(function(cp){
      var s=proj(cp.lon,cp.lat);if(s[0]<-60||s[0]>W+60||s[1]<-30||s[1]>H+30)return;
      ctx.fillStyle="#10161b";ctx.strokeStyle=acc;ctx.lineWidth=1.8;
      ctx.beginPath();ctx.arc(s[0],s[1],5,0,7);ctx.fill();ctx.stroke();
    });
    if(view.scale>800){
      if(view.scale>900){
        ctx.font="600 11px Barlow,sans-serif";
        (rt.camps||[]).forEach(function(cp){
          var s=proj(cp.lon,cp.lat);
          if(s[0]<-60||s[0]>W+60||s[1]<-30||s[1]>H+30)return;
          if(!free(s[0]+9,s[1]+4))return;
          halo(cp.n,s[0]+9,s[1]+4);
        });
      }
      if(multi){
        /* etiquetas de cada vía, con su color */
        ctx.font="600 11px Barlow,sans-serif";
        multi.forEach(function(it){
          var lb=it.r.label;if(!lb)return;
          var s=proj(lb.lon,lb.lat);
          if(s[0]<-80||s[0]>W+80||s[1]<-40||s[1]>H+40)return;
          if(!free(s[0],s[1]))return;
          ctx.lineWidth=3;ctx.strokeStyle="rgba(10,14,17,.85)";
          var txt=it.r.name;
          ctx.strokeText(txt,s[0],s[1]);ctx.fillStyle=it.r.color||acc;ctx.fillText(txt,s[0],s[1]);
        });
        /* hitos (corredores, gendarmes, muros...) */
        ctx.font="600 10px Barlow,sans-serif";
        multi.forEach(function(it){
          (it.r.marks||[]).forEach(function(mk){
            var s=proj(mk.lon,mk.lat);
            if(s[0]<-60||s[0]>W+60||s[1]<-30||s[1]>H+30)return;
            ctx.fillStyle=it.r.color||acc;
            ctx.beginPath();ctx.arc(s[0],s[1],3,0,7);ctx.fill();
            if(!free(s[0]+8,s[1]+3))return;
            halo(mk.n,s[0]+8,s[1]+3);
          });
        });
      }
    }
  }
  drawScale();
}
function drawLines(groups){
  ctx.beginPath();
  groups.forEach(function(g){
    g.lines.forEach(function(line){
      var started=false;
      for(var i=0;i<line.length;i++){
        var s=proj(line[i][0],line[i][1]);
        if(s[0]<-80||s[0]>W+80||s[1]<-80||s[1]>H+80){started=false;continue;}
        if(!started){ctx.moveTo(s[0],s[1]);started=true;}else ctx.lineTo(s[0],s[1]);
      }
    });
  });
  ctx.stroke();
}
function fillLines(g,color){
  ctx.beginPath();
  g.lines.forEach(function(line){
    for(var i=0;i<line.length;i++){var s=proj(line[i][0],line[i][1]);
      if(i===0)ctx.moveTo(s[0],s[1]);else ctx.lineTo(s[0],s[1]);}
    ctx.closePath();
  });
  ctx.fillStyle=color;
  ctx.globalAlpha=0.32;ctx.fill();ctx.globalAlpha=1;
  ctx.strokeStyle=color;ctx.lineWidth=1.2;ctx.stroke();
}
function halo(txt,x,y){
  ctx.lineWidth=3;ctx.strokeStyle="rgba(10,14,17,.85)";
  ctx.strokeText(txt,x,y);ctx.fillStyle=css("--ink");ctx.fillText(txt,x,y);
}
function haloC(txt,x,y){
  ctx.lineWidth=3.5;ctx.strokeStyle="rgba(10,14,17,.9)";
  ctx.strokeText(txt,x,y);ctx.fillStyle=css("--ink");ctx.fillText(txt,x,y);
}
/* scale bar */
function drawScale(){
  var mPerPx=111320/view.scale; /* px horizontales ya corregidos por cos(lat) */
  var target=110*mPerPx,pw=Math.pow(10,Math.floor(Math.log10(target)));
  var nice=[1,2,5,10].map(function(m){return m*pw;}).filter(function(v){return v<=target*1.6;});
  var val=nice.length?nice[nice.length-1]:pw,pxLen=val/mPerPx;
  $("sbBar").style.width=Math.round(pxLen)+"px";
  $("sbTxt").textContent=val>=1000?(val/1000)+" "+"km":Math.round(val)+" "+"m";
}

/* ---------------- interaction ---------------- */
(function(){
  var pointers={},downPos=null,moved=false,pinchD0=0,pinchS0=0;
  cv.addEventListener("pointerdown",function(e){
    cv.setPointerCapture(e.pointerId);pointers[e.pointerId]=[e.clientX,e.clientY];
    if(Object.keys(pointers).length===1){downPos=[e.clientX,e.clientY];moved=false;cv.classList.add("dragging");}
    else if(Object.keys(pointers).length===2){
      var k=Object.keys(pointers),a=pointers[k[0]],b=pointers[k[1]];
      pinchD0=Math.hypot(a[0]-b[0],a[1]-b[1]);pinchS0=view.scale;
    }
  });
  cv.addEventListener("pointermove",function(e){
    if(!(e.pointerId in pointers))return;
    var prev=pointers[e.pointerId];pointers[e.pointerId]=[e.clientX,e.clientY];
    var n=Object.keys(pointers).length;
    if(n===1){
      var dx=e.clientX-prev[0],dy=e.clientY-prev[1];
      if(downPos&&Math.hypot(e.clientX-downPos[0],e.clientY-downPos[1])>5)moved=true;
      if(moved){view.clon-=dx/view.scale/cosC();view.clat+=dy/view.scale;clampView();requestRender();}
    }else if(n===2){
      var k=Object.keys(pointers),a=pointers[k[0]],b=pointers[k[1]];
      var d=Math.hypot(a[0]-b[0],a[1]-b[1]);
      if(pinchD0>0){
        var mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;
        var r=cv.getBoundingClientRect();
        var f=(pinchS0*d/pinchD0)/view.scale;
        zoomAt(mx-r.left,my-r.top,f);
      }
    }
  });
  function up(e){
    delete pointers[e.pointerId];
    cv.classList.remove("dragging");
    if(Object.keys(pointers).length===0&&downPos&&!moved)handleClick(e.clientX,e.clientY);
    downPos=null;
  }
  cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
  cv.addEventListener("wheel",function(e){
    e.preventDefault();
    var r=cv.getBoundingClientRect();
    zoomAt(e.clientX-r.left,e.clientY-r.top,Math.pow(1.0016,-e.deltaY));
  },{passive:false});
  cv.addEventListener("dblclick",function(e){
    var r=cv.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,2);
  });
  function handleClick(cx,cy){
    var r=cv.getBoundingClientRect(),x=cx-r.left,y=cy-r.top,best=null,bd=18;
    peaks.forEach(function(p){
      var s=proj(p.lon,p.lat),d=Math.hypot(s[0]-x,s[1]-y);
      if(d<bd){bd=d;best=p;}
    });
    if(best)openSheet(best.id);
  }
})();

function zoneName(id){var z=zones.filter(function(z){return z.id===id;})[0];return z?z.n:id;}

  return peaks.filter(function(p){
    if(query){var hay=(p.n+" "+(p.aka||[]).join(" ")).toLowerCase();
      if(hay.indexOf(query)<0)return false;}
    return true;
  });
}

function centerOn(lon,lat,zoomIn){
  view.clon=lon;view.clat=lat;

  clampView();requestRender();

/* ---------------- peak sheet ---------------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function nearby(p){
  return peaks.filter(function(q){return q.id!==p.id&&havKm(p.lat,p.lon,q.lat,q.lon)<150;})
    .map(function(q){return{p:q,d:havKm(p.lat,p.lon,q.lat,q.lon)};})
    .sort(function(a,b){return a.d-b.d;});
}
function photoHtml(p){
  var ph=(p.photo!=null&&photos[p.photo])?photos[p.photo]:null;
  if(!ph)return '<div class="mono"><span>'+esc(p.n.charAt(0).toUpperCase())+'</span></div>';
  var cap="© "+esc(ph.by||"")+" · "+esc(ph.lic||"");
  return '<img class="ph" src="'+esc(ph.t||ph.u)+'" alt="'+esc(p.n)+'" loading="lazy">'+
    '<div class="phcap">'+(ph.src?'<a href="'+esc(ph.src)+'" target="_blank" rel="noopener">'+cap+'</a>':cap)+'</div>';
}
function openSheet(id){
  var p=peaks.filter(function(x){return x.id===id;})[0];if(!p)return;
  openPeakId=id;
  var i=peaks.indexOf(p),nr=nearby(p),patch=getPatch(id),rt=getRoute(id);
  var evs=rt?(rt.events||[]):[];
  var fa=p.fa?('<b>'+p.fa.y+'</b> — '+esc(p.fa.by)):"–";
  var h='<div class="shead">'+photoHtml(p)+
    '<button class="x" id="shX" aria-label="'+esc("Cerrar")+'"><svg viewBox="0 0 16 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"><path d="M3 3l10 10M13 3L3 13"/></svg></button></div>'+
    '<div class="body">'+
    '<div class="rankline">'+esc("n.º")+' '+(i+1)+' · '+esc(zoneName(p.zone))+'</div>'+
    '<h2>'+esc(p.n)+'</h2>'+
    (p.aka&&p.aka.length?'<div class="aka">'+esc(p.aka.join(" · "))+'</div>':"")+
    '<div class="facts">'+

      rt.routes.map(function(r){
        return '<li><div class="rh"><i style="background:'+esc(r.color||"#999")+'"></i><b>'+r.y+'</b><span>'+esc(r.name)+'</span></div>'+

      '</ul>':"")+
    (p.bc?'<div class="sect">'+esc("Campo base")+'</div><div class="bcrow"><span>'+esc(p.bc.n)+'</span>'+
      '<button class="btn" id="shMap"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 14s5-4.6 5-8.2A5 5 0 003 5.8C3 9.4 8 14 8 14z"/><circle cx="8" cy="6" r="1.8"/></svg>'+esc("Ver en mapa")+'</button></div>':"")+
    (nr.length?'<div class="sect">'+esc("Cimas cercanas")+'</div><div class="near">'+

      '</div>':"")+
    '<div class="snav">'+

    '<button class="btn" id="shNext">'+esc("Siguiente")+' ›</button>'+
    (patch?'<button class="btn primary" id="sh3d"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1.8l6 10.2H2z"/><path d="M8 1.8v12"/></svg>'+esc("Ver en 3D")+'</button>':"")+
    '</div>'+

  var sh=$("sheet");sh.innerHTML=h;sh.classList.add("open");
  if(window.innerWidth<=900)$("side").classList.remove("open");

  $("shPrev").onclick=function(){openSheet(peaks[(i-1+peaks.length)%peaks.length].id);};

/* ---------------- 3D viewer ---------------- */
var renderer3d=null,scene3d=null,cam3d=null,raf3d=null;
function close3D(){
  if(raf3d)cancelAnimationFrame(raf3d);raf3d=null;
  $("m3d").classList.remove("open");
  if(renderer3d){renderer3d.dispose();renderer3d=null;}
  scene3d=null;cam3d=null;$("m3dView").innerHTML="";
}
function open3D(p){
  var pc=getPatch(p.id);if(!pc)return;
  $("m3dTitle").textContent=p.n+" — 3D";
  $("m3d").classList.add("open");
  var wrap=$("m3dView");wrap.innerHTML="";
  var W3=wrap.clientWidth||800,H3=wrap.clientHeight||560;
  Promise.all([import("three"),import("three/addons/controls/OrbitControls.js"),
    import("three/addons/lines/Line2.js"),import("three/addons/lines/LineMaterial.js"),
    import("three/addons/lines/LineGeometry.js")]).then(function(m){
    var THREE=m[0],OrbitControls=m[1].OrbitControls,
        Line2=m[2].Line2,LineMaterial=m[3].LineMaterial,LineGeometry=m[4].LineGeometry;
    var d=decInts(pc.dem),w=pc.w,h=pc.h;
    var zmin=Math.min.apply(null,d),zmax=Math.max.apply(null,d);
    var kmLon=(pc.lon1-pc.lon0)*111.32*Math.cos(((pc.lat0+pc.lat1)/2)*Math.PI/180);
    var kmLat=(pc.lat1-pc.lat0)*110.54,ext=Math.max(kmLon,kmLat);
    var ex=1.6;
    var geo=new THREE.PlaneGeometry(kmLon,kmLat,w-1,h-1);
    var pos=geo.attributes.position,colors=new Float32Array(pos.count*3);
    var cA=new THREE.Color(),tmp=[0,0,0];
    for(var k=0;k<pos.count;k++){
      var ix=k%(w),iy=Math.floor(k/w),idx=iy*w+ix,z=d[idx];
      var zz=(z-zmin)/1000*ex;
      pos.setZ(k,zz);
      var c=rampColor(z);tmp=[c[0]/255,c[1]/255,c[2]/255];
      cA.setRGB(tmp[0],tmp[1],tmp[2]);
      var shade=0.75+0.25*((z-zmin)/Math.max(1,zmax-zmin));
      colors[k*3]=Math.min(1,cA.r*shade);colors[k*3+1]=Math.min(1,cA.g*shade);colors[k*3+2]=Math.min(1,cA.b*shade);
    }
    /* PlaneGeometry va en XY con origen en el centro: reorientar a XZ. */
    geo.rotateX(-Math.PI/2);
    geo.setAttribute("color",new THREE.BufferAttribute(colors,3));
    geo.computeVertexNormals();
    renderer3d=new THREE.WebGLRenderer({antialias:true});
    renderer3d.setPixelRatio(Math.min(devicePixelRatio||1,2));
    renderer3d.setSize(W3,H3);
    renderer3d.shadowMap.enabled=true;
    renderer3d.shadowMap.type=THREE.PCFSoftShadowMap;
    wrap.appendChild(renderer3d.domElement);
    scene3d=new THREE.Scene();
    /* cielo con degradado en vez de fondo plano */
    (function(){
      var cv=document.createElement("canvas");cv.width=4;cv.height=256;
      var g=cv.getContext("2d"),gr=g.createLinearGradient(0,0,0,256);
      gr.addColorStop(0,"#04070c");gr.addColorStop(0.55,"#0a1220");gr.addColorStop(1,"#0d141c");
      g.fillStyle=gr;g.fillRect(0,0,4,256);
      var bg=new THREE.CanvasTexture(cv);bg.colorSpace=THREE.SRGBColorSpace;
      scene3d.background=bg;
    })();
    /* niebla sutil para dar profundidad */
    scene3d.fog=new THREE.Fog(0x0d141c,ext*1.4,ext*4);
    cam3d=new THREE.PerspectiveCamera(48,W3/H3,0.01,ext*8);
    cam3d.position.set(ext*0.42,(zmax-zmin)/1000*ex+ext*0.42,ext*0.75);
    var ctl=new OrbitControls(cam3d,renderer3d.domElement);
    ctl.target.set(0,(zmax-zmin)/1000*ex*0.4,0);ctl.enableDamping=true;ctl.dampingFactor=0.08;
    scene3d.add(new THREE.AmbientLight(0xffffff,0.62));
    var sun=new THREE.DirectionalLight(0xfff2dd,1.5);
    var azr=SUN_AZ*Math.PI/180;sun.position.set(Math.sin(azr),1.1,Math.cos(azr)).multiplyScalar(ext*2);
    /* sombras reales sobre el relieve */
    sun.castShadow=true;
    sun.shadow.mapSize.set(2048,2048);
    sun.shadow.camera.left=-ext;sun.shadow.camera.right=ext;
    sun.shadow.camera.top=ext;sun.shadow.camera.bottom=-ext;
    sun.shadow.camera.near=ext*0.5;sun.shadow.camera.far=ext*5;
    sun.shadow.camera.updateProjectionMatrix();
    sun.shadow.bias=-0.0004;
    scene3d.add(sun);
    var mat3d=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.95,metalness:0});
    var mesh=new THREE.Mesh(geo,mat3d);
    mesh.castShadow=true;mesh.receiveShadow=true;
    scene3d.add(mesh);
    /* textura satelital si existe para este pico (tex/<id>.jpg);
       si no, se queda el sombreado por altura */
    $("m3dSat").style.display="none";
    new THREE.TextureLoader().load("tex/"+p.id+".jpg",
      function(tx){
        tx.colorSpace=THREE.SRGBColorSpace;
        tx.anisotropy=renderer3d.capabilities.getMaxAnisotropy();
        mat3d.map=tx;mat3d.vertexColors=false;mat3d.needsUpdate=true;
        $("m3dSat").style.display="block";
      },undefined,function(){});
    /* vías (sin campamentos en 3D: ya están en el plano) */
    var rt=getRoute(p.id),acc3=0xff6b5e;
    function demAt(lon,lat){
      var fx=(lon-pc.lon0)/(pc.lon1-pc.lon0)*(w-1),fy=(pc.lat1-lat)/(pc.lat1-pc.lat0)*(h-1);
      fx=Math.max(0,Math.min(w-1.001,fx));fy=Math.max(0,Math.min(h-1.001,fy));
      var x0=Math.floor(fx),y0=Math.floor(fy),ax=fx-x0,ay=fy-y0,i=y0*w+x0;
      return d[i]*(1-ax)*(1-ay)+d[i+1]*ax*(1-ay)+d[i+w]*(1-ax)*ay+d[i+w+1]*ax*ay;
    }
    function scXYZ(lon,lat,off){
      var fi=(lon-pc.lon0)/(pc.lon1-pc.lon0),fj=(pc.lat1-lat)/(pc.lat1-pc.lat0);
      return [(fi-0.5)*kmLon,((demAt(lon,lat)-zmin)/1000)*ex+(off||0),(fj-0.5)*kmLat];
    }
    if(rt&&rt.line){
      /* una o varias vías, cada una con su color; líneas gruesas (Line2) */
      var rl3=(rt.routes&&rt.routes.length)?
        rt.routes.map(function(r){return {lines:decLines(r.line),color:r.color};}):
        [{lines:routeLines(p.id),color:null}];
      var lineMats=[];
      rl3.forEach(function(it,ix){
        var rpts=[];
        (it.lines||[]).forEach(function(line){
          line.forEach(function(pt){var s=scXYZ(pt[0],pt[1],ext*0.012);rpts.push(s[0],s[1],s[2]);});
        });
        if(rpts.length<6)return;
        var normal=ix===0;
        var lg=new LineGeometry();lg.setPositions(rpts);
        var lm=new LineMaterial({
          color:it.color?(new THREE.Color(it.color)).getHex():acc3,
          linewidth:normal?4:3,
          dashed:normal,dashScale:1,dashSize:0.9,gapSize:0.55
        });
        lm.resolution.set(W3,H3);
        var l2=new Line2(lg,lm);l2.computeLineDistances();l2.frustumCulled=false;l2.renderOrder=4;
        scene3d.add(l2);lineMats.push(lm);
      });
    }
    function loop(){raf3d=requestAnimationFrame(loop);ctl.update();renderer3d.render(scene3d,cam3d);}
    loop();
    window.addEventListener("resize",function onR(){
      if(!renderer3d){window.removeEventListener("resize",onR);return;}
      var w2=wrap.clientWidth,h2=wrap.clientHeight;
      cam3d.aspect=w2/h2;cam3d.updateProjectionMatrix();renderer3d.setSize(w2,h2);
      (lineMats||[]).forEach(function(lm){lm.resolution.set(w2,h2);});
    });
  }).catch(function(){close3D();});
}
$("m3dX").onclick=close3D;
$("m3d").addEventListener("click",function(e){if(e.target===$("m3d"))close3D();});

[["lContours","contours"],["lWater","water"],["lTowns","towns"],["lBorders","borders"],["lLabels","labels"]]

/* ---------------- init ---------------- */
function onPatchData(){ /* datos-picos.js (defer) ya se ha ejecutado */
  patchCache={};
  if(openPeakId)openSheet(openPeakId); /* reevaluar botón 3D */
  requestRender();
}
function onRoutesData(){ /* datos-rutas.js (defer) ya se ha ejecutado */
  routeCache={};
  if(openPeakId)openSheet(openPeakId); /* mostrar vía y efemérides */
  requestRender();
}
function init(){
  if(!loadData())return;
  renderList();renderStats();drawScale();
  resize();fitAll();requestRender();
  openSheet("everest"); /* ficha fija con el Everest por defecto */
  $("loader").classList.add("done");
}
document.addEventListener("DOMContentLoaded",function(){
  if(hasPatch())onPatchData();
  onRoutesData();
  setTimeout(function(){if(hasPatch())onPatchData();onRoutesData();},1500); /* red de seguridad */
});
init();
